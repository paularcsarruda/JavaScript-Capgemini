<!DOCTYPE html>
<html lang="pt">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Vetores</title>

     <script>
          //[Vetores (Arrays) - Estrutura de dados que armazena múltiplos valores em uma única variável]
          let cursos = ["JavaScript", "HTML", "CSS", "React", "Node.js"];
          for (let i = 0; i < cursos.length; i++) {
               //exibir os vetores na tela
               alert("Curso disponível: " + cursos[i]);
          }
     </script>
</head>

</body>
</html>
