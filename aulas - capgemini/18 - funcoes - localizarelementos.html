<!DOCTYPE html>
<html lang="pt">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Localizar Elementos</title>

     <script>
          // Declaração de variável
          let nome = "Paula Roberta";

          // Retornar a posição do primeiro caractere "a"
          alert(nome.indexOf("a")); // 2

          // Retornar a posição do último caractere "a"
          alert(nome.lastIndexOf("a")); // 10

     </script>
</head>
<body>
     
</body>
</html>
