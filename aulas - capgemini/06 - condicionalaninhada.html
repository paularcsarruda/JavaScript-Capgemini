     <title>Condicional Aninhada</title>

     <script>
          // Condicional Aninhada em JavaScript
          let media = 8.5;
          if (media>= 7) {
               alert("Parabéns! Aluno Aprovado!");
          } else {
               if (media >= 5 && media < 7) {
                    alert("Aluno em Recuperação!");
               } else {
                    alert("Aluno Reprovado!");
               }
          }
     </script>
</head>
