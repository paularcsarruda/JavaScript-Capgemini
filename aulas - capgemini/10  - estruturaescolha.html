<!DOCTYPE html>
<html lang="pt">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Estrutura de Escolha</title>

     <script>
          //Estrutura de Escolha (if...else)
          let codigo = 8;

          switch (codigo) {
               case 1:
                    alert("Produto 1 selecionado!");
                    break;
               case 2:
                    alert("Produto 2 selecionado!");
                    break;
               case 3:
                    alert("Produto 3 selecionado!");
                    break;
               default:
                    alert("Código inválido! Produto não encontrado.");
          }
     </script>
</head>

</body>
</html>
