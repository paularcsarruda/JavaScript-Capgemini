<!DOCTYPE html>
<html lang="pt">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>While</title>
     <script>
          //Laço WHILE
          let contador = 1;

          while (contador <= 3) {
               alert("Contador é igual a " + contador);
               contador++;
          }
     </script>
</head>
