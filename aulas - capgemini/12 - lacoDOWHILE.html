<!DOCTYPE html>
<html lang="pt">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Laço de Repetição While Do</title>
     <script>
          //Laço DO WHILE (primeiro executa a ação e depois valida a condição)
          let contador = 1;

          do {
               alert("Contador é igual a " + contador);
               contador++;
          } while (contador <= 3);
     </script>
</head>

</body>
</html>
