<!DOCTYPE html>
<html lang="pt">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Arrays</title>

     <script>
          //vetor de objetos guarda múltiplos valores com diferentes propriedades
          let produtos = [
               { nome: "Notebook", preco: 2500, estoque: 10 },
               { nome: "Smartphone", preco: 1500, estoque: 25 },
               { nome: "Tablet", preco: 800, estoque: 15 }
          ];
          for (let i = 0; i < produtos.length; i++) {
               let produto = produtos[i];
               alert("Produto: " + produto.nome + "\nPreço: R$" + produto.preco + "\nEstoque: " + produto.estoque + " unidades");
          }
     </script>
</head>
<body>
     
</body>
</html>
