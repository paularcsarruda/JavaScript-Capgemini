<!DOCTYPE html>
<html lang="pt">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Mínimo e Máximo</title>

     <script>
          // Obter o menor valor
          alert("O valor minimo é " + Math.min(5, -10, 2, 8, 3)); // -10

          // Obter o maior valor
          alert("O valor maximo é " + Math.max(-5, 10, 2, 8, 3)); // 10
     </script>
</head>

</body>
</html>
