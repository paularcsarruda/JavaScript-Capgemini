<!DOCTYPE html>
<html lang="pt">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Operadores Relacionais</title>
     
     <!-- JavaScript -->
     <script>
          // Operadores Relacionais em JavaScript
          let a = 10;
          let b = 20;
          alert(a > b);  // false
          alert(a < b);  // true
          alert(a == b); // false
          alert(a != b); // true
          alert("a + b= " + (a + b));
     </script>
</head>

</body>
</html>
